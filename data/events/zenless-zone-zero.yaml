  color: '#d9c9a8'
  description: 亲爱的绳匠： 活动期间，绳匠可以在「丽都城募」中，通过提升城募等级获取丰厚奖励！ 解锁「成长计划」，更可立即获得[菲林]*680与专属头像 [风浪的起点] 。解锁「典藏计划」，还可额外立即获得[菲林]*208、「导览套件」、[音擎主控芯片]、[谐振核心仪]与[以太电池]奖励！
    解锁「成长计划」或「典藏计划」后通过提升城募等级还可获得专属名片 [回归海洋之前] 、[音擎主控芯片]、[谐振核心仪]、[「仓鼠笼」访问器]、养成材料等奖励！其中养成材料奖励绳匠可自选类型进行获取。 【活动时间】 3.2版本更新后 ~
    2026/10/19 03:59 ※ 2026/10/19 02:59 将关闭本次活动中「成长计划」「典藏计划」「计划升级」的购买，购买关闭后绳匠仍可完成成长任务并领取奖励，请绳匠留意可购买时间和活动时间。 【参与条件】 主线第一章「猫的失物」中解锁
    「实战模拟室」 后即可参与。 【活动说明】 • 每期「丽都城募」开启后，「基础方案」将自动解锁。绳匠可以通过完成「成长任务」获取城募经验，提高城募等级，获取更多奖励。 • 已解锁「成长计划」的绳匠，如有需要，可通过购买「计划升级」升级至「典藏计划」。
    • 「丽都城募」的奖励中也将新增适配 [锋御] 代理人的音擎。解锁「成长计划」或「典藏计划」并提升城募等级至30级后，在领取[伟大建设者凭证]后，即可在包含A级音擎 「血髓秘匣」 在内的7件音擎中任选其一获取。[伟大建设者凭证]属于当期限时奖励，不会保留至下一期丽都城募，超期未使用将自动失效。
    • 详细规则请前往游戏内 「丽都城募」 查看。
