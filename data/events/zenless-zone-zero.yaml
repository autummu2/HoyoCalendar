  description: 【活动时间】 3.1版本更新后 ~3.1版本结束 【活动奖励】 【活动说明】 • 活动期间，绳匠购买[菲林底片]、[丽都城募]、现金[礼包]、[绳网会员]等均可获取一定数量的 纪念票根 ，累计获取纪念票根可解锁对应档位奖励。
    • 活动期间，绳匠可获取的纪念票根数量上限为 15000 。 • 纪念票根为活动限时道具，仅可在本次活动期间获取与使用，活动结束后将清空。 【纪念票根换算规则说明】 一、「底片选购」换算规则说明 • [菲林底片*60] - 60纪念票根
    • [菲林底片*300] - 300纪念票根 • [菲林底片*980] - 980纪念票根 • [菲林底片*1980] - 1980纪念票根 • [菲林底片*3280] - 3280纪念票根 • [菲林底片*6480] - 6480纪念票根
    ※ 首充双倍及加赠获取的[菲林底片]不会计入纪念票根获取进度。 二、「丽都城募」换算规则说明 • 「成长计划」 - 680纪念票根 • 「典藏计划」 - 1280纪念票根 • 「计划升级」 - 780纪念票根 三、「绳网会员」换算规则说明
    • 「绳网会员」*1 - 300纪念票根 ※ 「绳网会员」剩余生效时间≥179天时，将无法续购。 四、现金礼包换算规则说明 • 「茶会邀约」限定礼盒 *1 - 300纪念票根 • 「云庭邀约」限定礼盒 *1 - 580纪念票根 • 「天枢邀约」限定礼盒
    *1 - 980纪念票根 • 「丽都迎新」礼盒*1 - 60纪念票根 • 「诚挚邀约」礼盒*1 - 300纪念票根 • 「青睐邀约」礼盒*1 - 680纪念票根 • 「独家邀约」礼盒*1 - 980纪念票根 ※ 菲林底片直购礼包不会计入纪念票根获取进度。
    【活动奖励】 • 累计获取300纪念票根：[以太电池]*2 • 累计获取1000纪念票根：[调律校音器]*1 • 累计获取2000纪念票根：绳匠配饰[星芒十字]、[加密母带]*2 • 累计获取4000纪念票根：[谐振核心仪]*2 • 累计获取7000纪念票根，绳匠可以从以下奖励中自选其一：S级音擎
    [飞鸟星梦] 、S级音擎 [玲珑妆匣] 、S级音擎 [机巧心种] 、 [音擎主控芯片]*4 （可在「珍藏兑换」中兑换S级音擎*1） • 累计获取10000纪念票根，绳匠可以从以下奖励中自选其一：S级代理人 [薇薇安] 、S级代理人 [耀嘉音]
    、S级代理人 [「席德」] 、 [特邀请柬]*2 （可在「珍藏兑换」中兑换S级代理人*1）；若绳匠在领取前已可唤醒对应代理人的全部意象影画，则无法领取该代理人，需返回重新选择其他奖励 • 累计获取15000纪念票根： 蕾米埃尔主题动态壁纸[汽水海的夏天]
    、 蕾米埃尔主题导览套件[「早安，共犯小姐」·主题]&[「早安，共犯小姐」·挂坠] 、 活动专属动态名片[万千昼夜] ※ 活动进度达到指定档位后，绳匠需在活动页面点击领取奖励。 ※ 请绳匠在3.1版本期间及时选择并领取限定S级音擎、限定S级代理人奖励；若绳匠达成奖励条件、但未在活动期间完成选择与领取，活动结束后将统一补发绳匠已达到奖励条件所对应的[音擎主控芯片]*4、[特邀请柬]*2。
    【特别说明】 • 纪念票根获取数量未达上限时，多次购买相同商品获得的纪念票根均会计入活动进度。 • 首充双倍及加赠获取的[菲林底片]、菲林底片直购礼包等不适用纪念票根换算规则的其他充值方式，均不会计入活动进度。 • 绳匠若通过游戏外充值方式（如网页充值中心等）完成充值，需在活动期间内登录游戏完成发货后，才能计入活动进度；如绳匠活动期间内完成充值后，未登录游戏完成发货，则无法计入活动进度。
    • 若通过非法手段或其他异常方式获取活动奖励，运营方有权采取扣除活动奖励等措施。
