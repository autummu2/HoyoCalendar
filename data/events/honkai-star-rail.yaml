- id: hsr-版本-2026-09-星际幻宠
  game: honkai-star-rail
  title: 「星际幻宠」
  type: 版本大活动
  start_date: '2026-09-28'
  end_date: '2026-11-10'
  color: '#b9d3f2'
  description: 亲爱的开拓者： 公司推出最新潮玩产品「星际幻宠」，并倾力打造了小家伙们的温馨乐园。它们不仅能在小窝里静静陪伴，更能作为银河漫游的好伙伴！ 活动期间，开拓者可使用「潮玩礼券」在「星际潮玩」中抽取多款类幻宠。 ■ 「潮玩礼券」获取方式
    点击展开查看 ● 「游园伴手礼」 ： 开拓等级≥4级的开拓者，4.6版本期间登录即可免费领取 「潮玩礼券」*6 ！ ● 「镇伏『贪饕』，汇聚愿力」 ：活动期间 ， 击败被「贪饕」侵蚀的敌人，积攒愿力可解锁 「潮玩礼券」*18 及更多奖励！
    ● 抽取界面兑换 ：使用 「潮玩代币」*180兑换「潮玩礼券」*1 。「古老梦华」*1可兑换「潮玩代币」*1，在「星际潮玩」界面通过【拆1盒】【拆6盒】按钮进行抽取时，可直接使用「古老梦华」兑换对应数量的「潮玩代币」。 ● 回收兑换 ：回收「星际幻宠」可获得
    「愿望星尘」，「愿望星尘」*180可在 「外观商店」中 兑换「潮玩礼券」*1。 ▌「星际潮玩」抽取 活动说明 活动期间，开拓者可使用「潮玩礼券」进行抽取。 本期「星际潮玩」抽取活动中，可获得的「星际幻宠」款类包括：经典款奇美拉、经典款猫猫狸、珍藏款奇美拉、珍藏款猫猫狸
    ，各款类的明细可在「星际潮玩」查看。 ■活动时间 4.6版本期间 ■ 抽取概率 在本期「星际潮玩」抽取活动中，获得各款类幻宠的概率分别如下： ●活动期间， 抽取 获得经典款 奇美拉 的基础概率为 88.800% ，综合概率（含保底）为
    70.443%， 各经典款奇美拉获得概率均等。 ●活动期间， 抽取 获得经典款 猫猫狸 的基础概率为 10.000% ，综合概率（含保底）为 22.704%， 各经典款 猫猫狸 获得概率均等。最多 6 次 抽取 必定能通过保底获得经典款
    猫猫狸或珍藏款（奇美拉或猫猫狸） ，通过该保底获得经典款 猫猫狸 的概率为 98.800% ，获得 珍藏款（奇美拉或猫猫狸） 的概率为 1.200% 。 ●活动期间， 抽取 获得 珍藏款（奇美拉或猫猫狸） 的基础概率为 1.200% ，综合概率（含保底）为
    6.853% ，最多 24 次 抽取 必定能通过保底获得 珍藏款（奇美拉或猫猫狸） 。 ●活动期间， 抽取 获得珍藏款奇美拉的基础概率为 0.960% ，综合概率（含保底）为 4.311%， 各珍藏款奇美拉获得概率均等。 ●活动期间，抽取获得珍藏款猫猫狸的基础概率为
    0.240% ，综合概率（含保底）为 2.542%， 各珍藏款猫猫狸获得概率均等。最多 4 次 抽取获得珍藏款时， 必定能通过保底获得 珍藏款猫猫狸 幻宠。 ※获得 珍藏款 后，开拓者可于游戏内将其外观自由切换为【 经典涂装 】或【珍藏涂装】进行展示。
    ※详细信息可前往「星际潮玩」查看。 ▌幻宠交换说明 点击展开查看 ●开拓者可以将拥有的「星际幻宠」与好友进行 幻宠交换 。 ●开拓者获取「星际幻宠」后解锁「交换广场」，在「交换广场」中，开拓者可以与好友交换星际幻宠，「交换广场」永久开放。
    ●「星际幻宠」仅可以在同 款类 之间进行交换：经典 款奇美拉幻宠只能和同样是 经典 款奇美拉的幻宠进行交换， 经典 款猫猫狸幻宠只能和同样是 经典 款猫猫狸的幻宠进行交换，珍藏款奇美拉幻宠只能和同样是珍藏款奇美拉的幻宠进行交换，珍藏款猫猫狸幻宠只能和同样是珍藏款猫猫狸的幻宠进行交换。
    ▌幻宠回收说明 点击展开查看 ●当开拓者拥有重复的 经典款 「星际幻宠」时，可以将第2个及以上的重复 经典款 「星际幻宠」回收成 「愿望星尘」 。 ●当满足回收条件时，每个经典款 猫猫狸 可以回收为 60 「愿望星尘」 ，每个经典款 奇美拉
    可以回收为 30 「愿望星尘」 。 ● 珍藏款 不可以被回收为 「愿望星尘」 。 ▌「星际幻宠」乐园 点击展开查看 公司为旗下最新潮玩产品「星际幻宠」倾力打造的线下乐园。在这里，你可以尽情探索关于它们的一切惊喜。 ■开放时间 2026/09/28
    4.6版本更新后永久开放 ■参与条件 开拓等级≥21级 ※本内容支持通过「终末视界」功能提前体验。 ※建议开拓者完成开拓任务「千星城」-「知识、沉默、擦肩而过」解锁场景「生研院」后体验本内容。 ■ 活动说明 ●开拓者可以将拥有的随宠（包含
    常规随宠 与 星际幻宠 ），分别布设在 「派对车厢」-「随宠小屋」 及 「生研院」 的特定区域中。 ●位于「生研院」的星际幻宠乐园，提供了 3个 随宠布设区域： 「休息区」「锻炼区」「喷泉区」 。不同区域中的随宠们有着不一样的表现。 ●开拓者可以邀请好友来到自己的幻宠乐园、或前往拜访好友的幻宠乐园，参观随宠布设、与随宠互动、体验「星际碰碰好搭档！」玩法等内容。
    ▌幻宠相关商店上新 点击展开查看 4.6版本更新后，「潮玩礼券」将会上架「时尚单品」。回收幻宠可获得「愿望星尘」用以兑换「潮玩礼券」。 ■外观商店-时尚单品 「潮玩礼券」： 「星际幻宠」乐园内专用礼券，用于在 「星际潮玩」中 抽取 「星际幻宠」
    。 ●上架时间：4.6版本期间 ●兑换价格：「愿望星尘」*180 ▌注意事项 点击展开查看 ●本期「星际潮玩」抽取活动结束后，未使用的「潮玩礼券」「潮玩代币」「愿望星尘」不会被回收，请开拓者注意活动时间、及时使用。 ●活动中出现的「潮玩」「乐园」等概念仅为游戏内玩法包装，不代表现实中的任何实物、服务或权益，详情请以游戏内实际内容为准。
  source_url: https://www.miyoushe.com/sr/article/78286288
