- id: hsr-大月-2026-08-45版本无名勋礼
  game: honkai-star-rail
  title: 4.5版本「无名勋礼」
  type: 大月卡
  start_date: '2026-08-26'
  end_date: '2026-09-27'
  color: '#d9c9a8'
  description: 亲爱的开拓者： 活动期间，开拓者可以在「无名勋礼」中，通过提升勋礼等级获取 星轨通票、自塑尘脂、命运的足迹 等奖励。 解锁「无名客的荣勋」后，可立即获得 星琼*680 ，提升勋礼等级可额外获得 光锥碎忆*1、星轨专票*4、自选4星光锥、变量骰子*1、
    自塑尘脂*2 、遗器残骸、通用命途材料「梦之珠泪」 等奖励！ 若开拓者解锁「无名客的奖章」，除以上奖励外将立即 提升10级勋礼等级 ，还可获得 头像「知更鸟•晴歌•竞逐」、头像「砂金•戏浪•竞逐」 、光锥碎忆*1、星琼*200、燃料 奖励！
    ※本期「无名勋礼」升级所需经验将会降低，以便开拓者在5周期间更快获取等级奖励，部分勋礼任务也将同步调整，更多详细信息可前往游戏内进行查看。 ▌开启时间 2026/08/26 4.5版本更新后 - 2026/09/28 03:59 ▌参与条件
    开拓等级≥12级，且完成开拓任务「雅利洛-Ⅵ」-「她等待刀尖已经太久」 ▌「无名勋礼」说明 ●「无名勋礼」开启后，「无名客的赠礼」将自动解锁。开拓者可通过完成本周任务、本期任务获得经验、提升勋礼等级。勋礼等级的上限为70级，达到指定等级将会获取星轨通票、自塑尘脂、命运的足迹等奖励。
    ●本周任务将在每周一04:00（服务器时间）刷新。 ●已解锁「无名客的荣勋」的开拓者，如有需要，可通过购买「荣勋授章」升级至「无名客的奖章」。 ▌注意事项 ●本期活动时间内，到达等级上限后，将不能通过任务获取经验。 ●如因特殊情况导致重复购买「无名客的荣勋」或「无名客的奖章」时，「无名客的经验」将无法累加，并将直接返还对应购买价格的古老梦华*750或古老梦华*1410。
    ●若因特殊情况导致重复购买「荣勋授章」时，将直接返还古老梦华*860。 ● 2026/09/28 02:59 将关闭本次活动中「无名客的荣勋」「无名客的奖章」「荣勋授章」的购买，购买关闭后开拓者仍可完成勋礼任务并领取奖励，请开拓者留意可购买时间和活动时间。
  source_url: https://www.miyoushe.com/sr/article/77537092
