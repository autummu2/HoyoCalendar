  description: 旧日星神「贪饕」渐趋苏醒，其力量正向外弥散……不过，听说阿哈来帮忙了？！ 帮阿哈收集愿力，获取增益对抗「贪饕」侵蚀吧！ ▌活动时间 4.6版本期间 ▌参与条件 完成冒险任务「拟造花萼（金）• 回忆之蕾」 ▌活动奖励
    ▌活动说明 ● 前往消灭受「贪饕」侵蚀的敌人，帮助阿哈汇聚愿力。 ● 根据消灭敌人的污染等级，每只可以汇聚4/10/40数量不等的愿力。 ● 愿力提升的同时，阿哈会赐予玩家力量，这些力量会帮助玩家在「贪饕」侵蚀的关卡中更好地消灭敌人。
