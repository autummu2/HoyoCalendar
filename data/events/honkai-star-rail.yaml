  color: '#c4e8e5'
  description: 一条废弃机铠管线经由幽灵斯科特改造，竟变成了可为幽灵赋予肉身的「林登™具身机铠」生产线！可这位老友难得做回善事，居然被横空出世的拉克什米绊住了脚，你决定与伙伴们携手，帮他完成考核，从「绯闻女友」手下顺利脱身！ ▌限时活动期
    2026/09/28 4.6版本更新后 - 2026/11/11 03:59 ※限时活动结束后，「 爱，幽灵与机器人 」将收录至「常时传略」中，开拓者可继续体验常驻玩法。 ▌参与条件 开拓等级≥21级 ※本内容支持通过「终末视界」功能提前体验。
    ※建议开拓者完成开拓任务「千星城」-「月升之前，与兽共舞」后体验本内容。 ▌活动奖励 ■限时奖励 ■常驻奖励 ▌活动说明 ● 开拓者在活动中，将帮助斯科特经营一座机铠工坊，争取赢下与拉克什米的赌约。 ●开拓者可以接取机铠订单，通过装配芯片来提高机铠性能，以此满足客户要求，获取营业收
    益。 ●在经营过程中，开拓者将陆续收到四位伙伴的协助，从而不断升级管线科技。 ●拉克什米将代表公司，对工坊进行5轮考核，通过考核就可以提升工坊等级。 ●完成订单，提高「设计等级」，可领取「股东分红」奖励。 ●限时活动期间，通过完成指定任务目标，可获取对应限时奖励。
    ▌注意事项 ● 「 爱，幽灵与机器人 」限时活动结束后，开拓者将无法获取活动期间的限时奖励，但仍可前往场景「生研院」体验活动并获取常驻奖励。
