- id: gi-高难-2026-08-幽境危战
  game: genshin-impact
  title: 「幽境危战」
  type: 高难挑战
  start_date: '2026-08-19'
  end_date: '2026-09-21'
  color: '#d8c4e8'
  description: 〓活动奖励〓 〓活动时间〓 整体活动时间：2026/08/19 10:00 ~ 2026/09/22 03:59 紊乱爆发期：2026/08/19 10:00 ~ 2026/08/29 03:59 〓参与条件〓 冒险等阶≥20级
    且完成魔神任务：序章·第三幕「巨龙与自由之歌」 ※ 完成魔神任务「危途疑踪」后体验更佳。 〓活动说明〓 ● 挑战玩法：旅行者需要选择一种难度进行挑战。进入挑战后，需要连续完成三场限时战斗，在限定时间内击败所有敌人。三场战斗均完成后，即视为挑战成功。
    ● 难度：由简至难分为「普通」、「进阶」、「困难」、「险恶」、「无畏」、「绝境」。 初始所选难度越高，挑战中的限制规则越多，面对敌人时的压力也将越大。 从「困难」难度开始，只有通过该难度的挑战，才可解锁下一个难度。 ● 「赋光之人」：在挑战中，将会有至多16位角色成为
    「赋光之人」。 「赋光之人」会获得增益，将其编入队伍能更好地帮助旅行者完成挑战。 「赋光之人」至多存在16位，会随着挑战情况发生变化。 在「绝境」难度下，「赋光之人」将不再获得增益。 ● 紊乱爆发期：挑战开启后的10天内，地脉紊乱点将处于爆发状态。
    在紊乱爆发期内，冒险等阶≥45及以上的旅行者，在「困难」及以上难度的挑战中完成战斗后，可以消耗树脂获取自选祝圣秘境的奖励，同时将积累「危战勋望」。 「危战勋望」达到相应目标，可获取额外圣遗物奖励和 「启圣之尘」 。 爆发期结束后，完成战斗后将不再能消耗树脂获取自选祝圣秘境的奖励。
    ● 奖励领取：完成较高难度的挑战后，可以一并获取该难度及以下难度对应的奖励。 「无畏」、「绝境」难度下，只有单人挑战成功才可领取奖励。 ● 多人挑战：所有难度均可进行多人挑战，至多支持4位旅行者一起进行挑战。 「普通」、「进阶」、「困难」难度下，可以进行匹配挑战或同一世界内多人挑战。
    「险恶」、「无畏」、「绝境」难度下，仅支持同一世界内多人挑战。 ※从本次活动起，获取的「幻煌至形」和「幻煌至形·真化」内，将新增一套武器外观。获取时，新旧武器外观将一并获得。
  source_url: https://www.miyoushe.com/ys/article/77537726
